name: Update Profile Telemetry SVG

on:
  schedule:
    - cron: "0 6 * * *" # Runs daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live telemetry SVG
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_telemetry.py

      - name: Commit updated SVG if changed
        run: |
          if [[ -n "$(git status --porcelain assets/telemetry-card.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/telemetry-card.svg
            git commit -m "chore(telemetry): refresh live GitHub metrics card"
            git push
          fi
