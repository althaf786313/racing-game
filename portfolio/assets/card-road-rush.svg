  <rect x="28" y="164" width="85" height="26" rx="6" fill="#10182b" stroke="#22304d"/><text x="70.5" y="181" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">Canvas 2D</text><rect x="121" y="164" width="85" height="26" rx="6" fill="#10182b" stroke="#22304d"/><text x="163.5" y="181" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">Web Audio</text><rect x="214" y="164" width="68" height="26" rx="6" fill="#10182b" stroke="#22304d"/><text x="248.0" y="181" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">ES6 JS</text><rect x="290" y="164" width="68" height="26" rx="6" fill="#10182b" stroke="#22304d"/><text x="324.0" y="181" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">60 FPS</text>

  <!-- Right Action Label -->
